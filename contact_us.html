<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelBloom - Contact Us</title>
  <link rel="stylesheet" href="travel_recommendation.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">TravelBloom</div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="about_us.html">About Us</a>
      <a href="contact_us.html">Contact Us</a>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Enter a destination or keyword">
      <button id="searchBtn">Search</button>
      <button id="clearBtn">Clear</button>
    </div>
  </nav>

  <div class="container">
    <h1>Contact Us</h1>
    <p><strong>Email:</strong> info@travelbloom.com</p>
    <p><strong>Phone:</strong> +1 (555) 123-4567</p>
    <p><strong>Address:</strong> 123 Explorer Street, Travel City</p>

    <h2>Send us a message</h2>
    <form id="contactForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>

  <div id="results"></div>

  <script src="travel_recommendation.js"></script>
  <script>
    // form submit par thank-you message dikhao
    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault(); // page reload roko
      alert("Thank you for contacting us! We will get back to you soon.");
      this.reset(); // form saaf karo
    });
  </script>
</body>
</html>
